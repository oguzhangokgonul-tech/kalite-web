{% extends "base.html" %}

{% block title %}Giriş - Aksiyon Takip Sistemi{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
      <form class="bg-white border rounded p-4" method="post">
        <h1 class="h4 mb-3">Giriş Yap</h1>
        <div class="mb-3">
          <label class="form-label" for="identity">Kullanıcı adı veya ad soyad</label>
          <input class="form-control" id="identity" name="identity" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Şifre</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Giriş Yap</button>
      </form>
    </div>
  </div>
{% endblock %}
