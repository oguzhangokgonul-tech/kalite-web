<!doctype html>
<html lang="{{ current_locale() }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <title>{{ _("Bağlantı Yok") }} | VolkaPortal</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #11213c; background: #f5f8fc; }
      main { width: min(100%, 440px); text-align: center; }
      .icon { width: 72px; height: 72px; display: grid; place-items: center; margin: 0 auto 22px; border: 1px solid #cfe0ff; border-radius: 18px; color: #0d6efd; background: #fff; font-size: 34px; }
      h1 { margin: 0 0 10px; font-size: clamp(24px, 7vw, 34px); }
      p { margin: 0 0 24px; color: #5c6f8f; line-height: 1.6; }
      button { min-height: 46px; padding: 0 20px; border: 0; border-radius: 7px; color: #fff; background: #0d6efd; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">!</div>
      <h1>{{ _("Bağlantı kurulamadı") }}</h1>
      <p>{{ _("VolkaPortal verileri güvenlik nedeniyle çevrimdışı saklanmaz. İnternet bağlantınızı kontrol edip yeniden deneyin.") }}</p>
      <button type="button" onclick="window.location.reload()">{{ _("Yeniden Dene") }}</button>
    </main>
  </body>
</html>
