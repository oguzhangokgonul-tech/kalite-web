{% extends "app_shell.html" %}{% import "components/ui.html" as ui %}{% block title %}Süreç Başlat{% endblock %}{% block app_content %}
{% call ui.page_header("Süreç Başlat", template.name ~ " · v" ~ version.version_number, icon="bi-play-circle") %}<a class="btn btn-outline-secondary" href="{{ url_for('workflows.dashboard') }}"><i class="bi bi-arrow-left"></i><span>İş Akışları</span></a>{% endcall %}
<form method="post" class="document-list-card p-3 p-lg-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-lg-8"><label class="form-label" for="title">Başlık</label><input class="form-control" id="title" name="title" maxlength="240" required></div><div class="col-lg-4"><label class="form-label" for="department_id">Departman</label><select class="form-select" id="department_id" name="department_id" required><option value="">Seçin</option>{% for department in departments %}<option value="{{ department.id }}">{{ department.name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label" for="description">Talep Açıklaması</label><textarea class="form-control" id="description" name="description" rows="5" maxlength="5000" required></textarea></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="{{ url_for('workflows.dashboard') }}">Vazgeç</a><button class="btn btn-primary" type="submit"><i class="bi bi-send"></i><span>Süreci Başlat</span></button></div></form>
{% endblock %}
