<article class="workflow-step" draggable="true">
  <div class="workflow-step-toolbar"><button class="workflow-drag-handle" type="button" title="Sürükleyerek sırala" aria-label="Adımı sürükle"><i class="bi bi-grip-vertical"></i></button><span class="workflow-step-number">{{ loop.index if loop is defined else 1 }}</span><strong class="workflow-step-summary">{{ step.name if step.name is defined else step.name_snapshot or 'Yeni adım' }}</strong><div class="btn-group ms-auto"><button class="btn btn-sm btn-outline-secondary move-step-up" type="button" title="Yukarı taşı" aria-label="Yukarı taşı"><i class="bi bi-arrow-up"></i></button><button class="btn btn-sm btn-outline-secondary move-step-down" type="button" title="Aşağı taşı" aria-label="Aşağı taşı"><i class="bi bi-arrow-down"></i></button><button class="btn btn-sm btn-outline-danger remove-step" type="button" title="Kaldır" aria-label="Adımı kaldır"><i class="bi bi-trash"></i></button></div></div>
  <div class="row g-3 mt-1">
    <div class="col-lg-4"><label class="form-label">Adım Adı</label><input class="form-control step-name" name="step_name" maxlength="180" required value="{{ step.name if step.name is defined else step.name_snapshot or '' }}"></div>
    <div class="col-6 col-lg-2"><label class="form-label">Adım Türü</label><select class="form-select step-type" name="step_type"><option value="approval" {% if step.step_type == 'approval' %}selected{% endif %}>Onay</option><option value="task" {% if step.step_type == 'task' %}selected{% endif %}>Görev</option><option value="notification" {% if step.step_type == 'notification' %}selected{% endif %}>Bilgilendirme</option></select></div>
    <div class="col-6 col-lg-2"><label class="form-label">Atama</label><select class="form-select assignment-mode" name="assignment_mode"><option value="user" {% if step.assignment_mode == 'user' %}selected{% endif %}>Kullanıcı</option><option value="role" {% if step.assignment_mode == 'role' %}selected{% endif %}>Rol</option><option value="department_manager" {% if step.assignment_mode == 'department_manager' %}selected{% endif %}>Departman Yöneticisi</option></select></div>
    <div class="col-lg-4 assignment-target-user"><label class="form-label">Sorumlu</label><select class="form-select" name="assigned_user_id"><option value="">Seçin</option>{% for user in users %}<option value="{{ user.id }}" {% if step.assigned_user_id == user.id %}selected{% endif %}>{{ user.full_name }}</option>{% endfor %}</select></div>
    <div class="col-lg-4 assignment-target-role"><label class="form-label">Rol</label><select class="form-select" name="assigned_role_key"><option value="">Seçin</option>{% for role in roles %}<option value="{{ role.key }}" {% if step.assigned_role_key == role.key %}selected{% endif %}>{{ role.name }}</option>{% endfor %}</select></div>
    <div class="col-6 col-lg-2"><label class="form-label">Termin (gün)</label><input class="form-control" type="number" name="due_days" min="0" max="365" value="{{ step.due_days if step.due_days is not none else 3 }}"></div>
    <div class="col-6 col-lg-2 approval-policy-wrap"><label class="form-label">Tamamlama</label><select class="form-select" name="approval_policy"><option value="any" {% if step.approval_policy != 'all' %}selected{% endif %}>Herhangi biri</option><option value="all" {% if step.approval_policy == 'all' %}selected{% endif %}>Herkes</option></select></div>
    <div class="col-12 col-lg-4 rejection-mode-wrap"><label class="form-label">Ret Davranışı</label><select class="form-select" name="rejection_mode"><option value="return" {% if step.rejection_mode != 'reject' %}selected{% endif %}>Talep sahibine gönder</option><option value="reject" {% if step.rejection_mode == 'reject' %}selected{% endif %}>Akışı reddet</option></select></div>
    <div class="col-12"><label class="form-label">Adım Açıklaması</label><textarea class="form-control" name="instructions" rows="2" maxlength="2000">{{ step.instructions_snapshot if step.instructions_snapshot is defined else step.instructions or '' }}</textarea></div>
  </div>
</article>
